<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Concrete asphalt base -->
  <rect width="350" height="200" fill="#131518"/>
  <rect x="15" y="15" width="320" height="170" fill="#21252b" stroke="#7A828A" stroke-width="1.5"/>
  
  <!-- Architectural drafting blueprint grid -->
  <g stroke="#7A828A" stroke-width="0.8" stroke-opacity="0.25">
    <line x1="0" y1="20" x2="350" y2="20"/>
    <line x1="0" y1="40" x2="350" y2="40"/>
    <line x1="0" y1="60" x2="350" y2="60"/>
    <line x1="0" y1="80" x2="350" y2="80"/>
    <line x1="0" y1="100" x2="350" y2="100"/>
    <line x1="0" y1="120" x2="350" y2="120"/>
    <line x1="0" y1="140" x2="350" y2="140"/>
    <line x1="0" y1="160" x2="350" y2="160"/>
    <line x1="0" y1="180" x2="350" y2="180"/>
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="340" y1="0" x2="340" y2="200"/>
  </g>

  <!-- Constructivist geometric modules -->
  <polygon points="40,150 120,40 160,40 80,150" fill="#8A6552" opacity="0.35" stroke="#8A6552" stroke-width="1.5"/>
  <rect x="180" y="45" width="120" height="90" fill="#9C8E85" opacity="0.15" stroke="#A3AAAE" stroke-width="1.2"/>
  <circle cx="240" cy="90" r="32" fill="none" stroke="#C2C7C5" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="180" y1="90" x2="300" y2="90" stroke="#8A6552" stroke-width="1.5"/>
  <line x1="240" y1="45" x2="240" y2="135" stroke="#8A6552" stroke-width="1.5"/>
  
  <!-- Architectural registration stamp -->
  <rect x="25" y="25" width="65" height="18" fill="#131518" stroke="#7A828A" stroke-width="1"/>
  <text x="32" y="38" font-family="monospace" font-size="9" fill="#C2C7C5" letter-spacing="1">АРХ-26</text>
</svg>
